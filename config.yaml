# 클라이언트(광고계정)별 설정. 비밀값(액세스 토큰, 웹훅 URL)은 여기에 쓰지 말고
# 환경변수(META_ACCESS_TOKEN, SLACK_WEBHOOK_URL ...) 또는 GitHub Secrets 로 넘기세요.

api_version: v21.0
timezone: Asia/Seoul
output_dir: reports

clients:
  - name: 봄날
    account_id: "1828231244405674"     # act_ 접두사 없이 숫자만
    currency: KRW
    # 성과 판단에 쓸 전환 액션 (actions[].action_type). 여러 개면 합산합니다.
    #  - 쇼핑몰 구매: offsite_conversion.fb_pixel_purchase (또는 omni_purchase)
    #  - 리드: lead / offsite_conversion.fb_pixel_lead
    #  - 메시지 문의: onsite_conversion.messaging_conversation_started_7d
    conversion_actions: [offsite_conversion.fb_pixel_purchase]
    monthly_budget: 6000000           # 월 예산 (페이싱 체크용, 0이면 생략)
    targets:
      cpa: 18000                      # 목표 전환당 비용
      roas: 3.0                       # 목표 ROAS (매출/광고비, 3.0 = 300%)
      ctr: 0.008                      # 최소 링크 CTR (0.8%)

# 일일 점검 규칙 임계값 (클라이언트별로 덮어쓰려면 clients[].rules 에 같은 키를 넣으세요)
rules:
  recent_days: 3                  # 최근 구간 (어제 포함 N일)
  baseline_days: 7                # 비교 기준 구간 (최근 구간 직전 N일)
  min_impressions: 1000           # 이보다 노출이 적으면 판단 보류
  fatigue_frequency: 3.0          # 7일 빈도가 이 이상 + CTR 하락이면 소재 피로
  high_frequency: 4.5             # CTR 하락이 없어도 경고하는 빈도
  ctr_drop: 0.25                  # 기준 대비 CTR 25% 이상 하락
  ctr_drop_z: 2.58                # CTR 하락의 통계적 유의성 기준 (2.58=99%, 1.96=95%)
  peak_ctr_drop: 0.4              # 최근 4주 최고 CTR 대비 40% 이상 하락 → 장기 피로
  cpa_warning_ratio: 1.3          # 목표 CPA 의 1.3배 초과 → 주의
  cpa_critical_ratio: 1.6         # 목표 CPA 의 1.6배 초과 → 위험
  roas_warning_ratio: 0.8         # 목표 ROAS 의 80% 미만 → 주의
  no_conversion_cpa_multiple: 2.0 # 목표 CPA 의 2배를 써도 전환 0 → 위험
  cpm_spike: 0.4                  # 기준 대비 CPM 40% 이상 상승
  winner_roas_ratio: 1.3          # 목표 ROAS 의 1.3배 이상 → 증액 후보
  min_ads_per_adset: 2            # 광고세트당 활성 소재가 이보다 적으면 제안
  # 캠페인 이름에 아래 단어가 있으면 인지/트래픽 목적으로 보고 CPA·ROAS 규칙을 적용하지 않음
  awareness_keywords: [트래픽, 브랜딩, 도달, 인지, awareness, traffic, reach]

notify:
  console: true
  # 환경변수로도 지정 가능: SLACK_WEBHOOK_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  slack_webhook_url: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  min_level: warning              # info | warning | critical
